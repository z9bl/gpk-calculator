<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="copyright" content="© 2026 Ельмеев Ярослав Евгеньевич">
    <title>Лицензионное соглашение</title>
    <style>
      body { margin: 0; background: #f5f6f8; color: #1a1f2b;
        font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 64px; }
      a { color: #1f5fbf; }
      /* Текст берётся из LICENSE как есть — переносы строк сохраняются. */
      pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 16px 0 0;
        font: inherit; font-size: 15px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p><a href="./">← К калькулятору</a></p>
      <!-- Единственный источник текста — файл LICENSE в корне, копии нет. -->
      <pre id="license-text">Загрузка текста соглашения…</pre>
      <noscript><p>Для отображения включите JavaScript или откройте <a href="LICENSE">файл LICENSE</a>.</p></noscript>
    </div>
    <script>
      fetch('LICENSE')
        .then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then((t) => { document.getElementById('license-text').textContent = t; })
        .catch(() => {
          document.getElementById('license-text').innerHTML =
            'Не удалось загрузить текст. Откройте <a href="LICENSE">файл LICENSE</a>.';
        });
    </script>
  </body>
</html>
